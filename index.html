<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART COMPANY AI</title>
  <style>
    :root {
      --bg-main: #090a0d;
      --bg-card: #12141a;
      --bg-elevated: #191c24;
      --silver: #d8dde6;
      --silver-muted: #9aa3b2;
      --border: rgba(216, 221, 230, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: linear-gradient(180deg, #07080a 0%, #11141c 100%);
      color: var(--silver);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .sub {
      color: var(--silver-muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }
    .box {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--silver-muted);
      margin-bottom: 8px;
    }
    input, textarea {
      width: 100%;
      background: var(--bg-main);
      color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      font-size: 0.95rem;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    button {
      background: linear-gradient(135deg, #e5e9f0, #9aa3b2);
      color: #090a0d;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--silver);
      border: 1px solid var(--border);
    }
    .status {
      font-size: 0.82rem;
      color: var(--silver-muted);
      margin-top: 8px;
    }
    .output {
      white-space: pre-wrap;
      line-height: 1.65;
      color: #f0f3f8;
      min-height: 90px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SMART COMPANY AI</h1>
    <p class="sub">منصة إدارة وتحليل ذكية — المفتاح محفوظ محلياً على جهازك فقط</p>

    <div class="box">
      <label for="apiKeyInput">مفتاح Gemini API (يُحفظ في localStorage فقط)</label>
      <input id="apiKeyInput" type="password" placeholder="الصق مفتاح Gemini هنا..." autocomplete="off" />
      <div class="row">
        <button id="saveKeyBtn" type="button">حفظ المفتاح على الجهاز</button>
        <button id="clearKeyBtn" class="secondary" type="button">مسح المفتاح</button>
      </div>
      <div id="keyStatus" class="status"></div>
    </div>

    <div class="box">
      <label for="promptInput">اطلب تحليلاً أو مهمة أعمال</label>
      <textarea id="promptInput" placeholder="مثال: اقترح خطة عمل سريعة لزيادة المبيعات هذا الشهر..."></textarea>
      <div class="row">
        <button id="runBtn" type="button">تحليل فوري</button>
      </div>
    </div>

    <div class="box">
      <label>النتيجة</label>
      <div id="outputBox" class="output">بانتظار إدخال المفتاح وطرح سؤالك...</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "smart_company_gemini_api_key";
    const apiKeyInput = document.getElementById("apiKeyInput");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const clearKeyBtn = document.getElementById("clearKeyBtn");
    const keyStatus = document.getElementById("keyStatus");
    const promptInput = document.getElementById("promptInput");
    const runBtn = document.getElementById("runBtn");
    const outputBox = document.getElementById("outputBox");

    function refreshKeyStatus() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        apiKeyInput.value = saved;
        keyStatus.textContent = "المفتاح محفوظ محلياً على هذا المتصفح فقط.";
      } else {
        keyStatus.textContent = "لا يوجد مفتاح محفوظ حالياً على هذا المتصفح.";
      }
    }

    saveKeyBtn.addEventListener("click", () => {
      const val = apiKeyInput.value.trim();
      if (!val) {
        keyStatus.textContent = "يرجى لصق مفتاح صالح أولاً.";
        return;
      }
      localStorage.setItem(STORAGE_KEY, val);
      refreshKeyStatus();
    });

    clearKeyBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      apiKeyInput.value = "";
      refreshKeyStatus();
    });

    runBtn.addEventListener("click", async () => {
      const apiKey = (localStorage.getItem(STORAGE_KEY) || apiKeyInput.value).trim();
      const prompt = promptInput.value.trim();

      if (!apiKey) {
        outputBox.textContent = "احفظ مفتاح Gemini API أولاً.";
        return;
      }
      if (!prompt) {
        outputBox.textContent = "اكتب سؤالك أو المهمة المطلوبة أولاً.";
        return;
      }

      runBtn.disabled = true;
      outputBox.textContent = "جاري التحليل...";

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          }
        );

        const data = await res.json();
        if (!res.ok) {
          outputBox.textContent = "خطأ من الخدمة: " + (data?.error?.message || res.status);
        } else {
          const text =
            data?.candidates?.[0]?.content?.parts?.map(p => p.text).filter(Boolean).join("\n") ||
            "لم يرد نموذج الذكاء الاصطناعي بنص.";
          outputBox.textContent = text;
        }
      } catch (err) {
        outputBox.textContent = "تعذر الاتصال: " + err.message;
      } finally {
        runBtn.disabled = false;
      }
    });

    refreshKeyStatus();
  </script>
</body>
</html>
