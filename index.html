<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART COMPANY AI</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0f12;
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: #15181e;
      border: 1px solid #262b34;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: 0.4px;
      color: #ffffff;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #9ca3af;
      font-size: 14px;
    }

    .card {
      background: #1c2028;
      border: 1px solid #2b313c;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #e5e7eb;
    }

    input[type="password"],
    textarea {
      width: 100%;
      background: #101318;
      color: #f9fafb;
      border: 1px solid #323946;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      outline: none;
    }

    input[type="password"]:focus,
    textarea:focus {
      border-color: #9ca3af;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-secondary {
      background: #262b35;
      color: #e5e7eb;
      border: 1px solid #38404f;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #9ca3af;
    }

    .result-box {
      background: #101318;
      border: 1px solid #2b313c;
      border-radius: 10px;
      padding: 14px;
      min-height: 110px;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 14px;
      color: #f3f4f6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SMART COMPANY AI</h1>
    <p class="subtitle">منصة إدارة وتحليل ذكية — المفتاح محفوظ محلياً على جهازك فقط</p>

    <div class="card">
      <label for="apiKeyInput">مفتاح Gemini API (يُحفظ في localStorage فقط)</label>
      <input
        type="password"
        id="apiKeyInput"
        placeholder="الصق مفتاح Gemini هنا..."
        autocomplete="off"
      />
      <div class="btn-row">
        <button type="button" class="btn-primary" id="saveKeyBtn">حفظ المفتاح على الجهاز</button>
        <button type="button" class="btn-secondary" id="clearKeyBtn">مسح المفتاح</button>
      </div>
      <div class="status" id="keyStatus">جاري التحقق من حالة المفتاح...</div>
    </div>

    <div class="card">
      <label for="promptInput">اطلب تحليلاً أو مهمة أعمال</label>
      <textarea
        id="promptInput"
        placeholder="مثال: اقترح خطة عمل سريعة لزيادة المبيعات هذا الشهر..."
      ></textarea>
      <div class="btn-row">
        <button type="button" class="btn-primary" id="analyzeBtn">تحليل فوري</button>
      </div>
    </div>

    <div class="card">
      <label>النتيجة</label>
      <div class="result-box" id="resultBox">ستظهر نتيجة التحليل هنا...</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "SMART_COMPANY_GEMINI_API_KEY";
    const MODEL_NAME = "gemini-3.8-flash";

    const apiKeyInput = document.getElementById("apiKeyInput");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const clearKeyBtn = document.getElementById("clearKeyBtn");
    const keyStatus = document.getElementById("keyStatus");
    const promptInput = document.getElementById("promptInput");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const resultBox = document.getElementById("resultBox");

    function refreshKeyStatus() {
      const savedKey = localStorage.getItem(STORAGE_KEY);
      if (savedKey && savedKey.trim()) {
        apiKeyInput.value = savedKey;
        keyStatus.textContent = "المفتاح محفوظ محلياً على هذا المتصفح فقط.";
      } else {
        apiKeyInput.value = "";
        keyStatus.textContent = "لا يوجد مفتاح محفوظ حالياً على هذا المتصفح.";
      }
    }

    saveKeyBtn.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        keyStatus.textContent = "يرجى لصق مفتاح Gemini API أولاً.";
        return;
      }
      localStorage.setItem(STORAGE_KEY, key);
      refreshKeyStatus();
    });

    clearKeyBtn.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      refreshKeyStatus();
      resultBox.textContent = "تم مسح المفتاح من هذا المتصفح.";
    });

    analyzeBtn.addEventListener("click", async () => {
      const apiKey = (localStorage.getItem(STORAGE_KEY) || apiKeyInput.value).trim();
      const prompt = promptInput.value.trim();

      if (!apiKey) {
        resultBox.textContent = "يرجى إدخال وحفظ مفتاح Gemini API أولاً.";
        return;
      }

      if (!prompt) {
        resultBox.textContent = "يرجى كتابة طلب أو مهمة أعمال قبل الضغط على تحليل فوري.";
        return;
      }

      analyzeBtn.disabled = true;
      resultBox.textContent = "جاري التحليل...";

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${encodeURIComponent(apiKey)}`;

        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [
              {
                parts: [{ text: prompt }]
              }
            ]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          const apiMessage = data?.error?.message || `HTTP ${response.status}`;
          throw new Error(apiMessage);
        }

        const parts = data?.candidates?.[0]?.content?.parts || [];
        const replyText = parts
          .map((part) => part.text || "")
          .join("")
          .trim();

        resultBox.textContent = replyText || "تم استلام الاستجابة ولكن لم يظهر نص.";
      } catch (error) {
        resultBox.textContent = `خطأ من الخدمة: ${error.message}`;
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    refreshKeyStatus();
  </script>
</body>
</html>
